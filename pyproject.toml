[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gt7tracetelem"
version = "0.1.3"
description = "TRACE - GT7 telemetry capture, live dashboard, and lap/race analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ransh"},
]
keywords = [
    "gran-turismo",
    "gt7",
    "telemetry",
    "sim-racing",
    "racing",
    "playstation",
    "motorsport",
    "dashboard",
    "lap-analysis",
    "udp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pycryptodome",
]

[project.urls]
Homepage = "https://gt7trace.netlify.app/"
Repository = "https://github.com/ransh2014/gt7telemtrace"
Issues = "https://github.com/ransh2014/gt7telemtrace/issues"
Changelog = "https://github.com/ransh2014/gt7telemtrace/blob/main/CHANGELOG.md"

[project.scripts]
gt7telem = "gt7telem.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gt7telem = ["*.csv"]
