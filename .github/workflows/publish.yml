name: Publish to PyPI

# Triggers on a version tag push, e.g.:
#   git tag v0.1.4 && git push origin v0.1.4
#
# One-time setup required on PyPI (this workflow uses trusted publishing --
# no API token stored in this repo):
#   1. https://pypi.org/manage/project/gt7tracetelem/settings/publishing/
#   2. Add a new trusted publisher:
#        Owner:            ransh2014
#        Repository name:  gt7telemtrace
#        Workflow name:    publish.yml
#        Environment name: (leave blank, or "pypi" if you add a matching
#                            GitHub Environment under Settings > Environments)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    # Gate: a tag must not publish or build a release whose tests fail.
    # (These release workflows used to run straight off the tag, in parallel
    # with -- and regardless of -- CI.)
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk (Race Analyst tests import tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: xvfb-run -a python -m pytest tests/ -q

  build:
    needs: test
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version v$ver"; exit 1
          fi

      - name: Install build tooling
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
