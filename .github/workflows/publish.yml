name: Publish to PyPI

# Triggers on a version tag push, e.g.:
#   git tag v0.1.4 && git push origin v0.1.4
#
# One-time setup required on PyPI (this workflow uses trusted publishing --
# no API token stored in this repo):
#   1. https://pypi.org/manage/project/gt7tracetelem/settings/publishing/
#   2. Add a new trusted publisher:
#        Owner:            ransh2014
#        Repository name:  gt7telemtrace
#        Workflow name:    publish.yml
#        Environment name: (leave blank, or "pypi" if you add a matching
#                            GitHub Environment under Settings > Environments)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
