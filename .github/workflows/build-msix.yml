name: Build MSIX (Microsoft Store)

# Runs on every release tag, like the PyPI, WinGet and Chocolatey workflows: it waits for "Build Windows Exe" to
# attach gt7telem-windows.zip to the release, takes that TRACE.exe, wraps it in an MSIX and uploads the .msix (plus the
# 300x300 Store-listing icon) as a build artifact. Upload the .msix in Partner Center. Can also be run by hand from
# the Actions tab with any release tag. The package is unsigned on purpose: Microsoft signs it after certification.
# (This used to chain off "Build Windows Exe" with workflow_run, which showed up under branch "main" and was easy to
# miss; triggering on the tag push, as the other release workflows do, makes it appear with them.)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for the release's Windows zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # build-windows.yml creates the release and uploads the zip a few minutes after the tag push.
          for i in $(seq 1 60); do
            if gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "gt7telem-windows.zip"; then
              echo "asset found (attempt $i)"; sleep 20; exit 0
            fi
            echo "gt7telem-windows.zip not on release $TAG yet (attempt $i), waiting 30s..."
            sleep 30
          done
          echo "gt7telem-windows.zip never appeared on $TAG (did Build Windows Exe fail?)"; exit 1

      - name: Download the release's Windows zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "gt7telem-windows.zip" --dir release
          7z x release/gt7telem-windows.zip -orelease/unzipped -y
          test -f release/unzipped/TRACE.exe

      - name: Stage the package folder
        shell: bash
        run: |
          mkdir -p pkg/Assets
          cp release/unzipped/TRACE.exe pkg/TRACE.exe
          cp LICENSE pkg/LICENSE.txt
          cp msix/AppxManifest.xml pkg/AppxManifest.xml
          python -m pip install pillow
          python msix/make_assets.py pkg/Assets store-listing-icon-300.png

      - name: Set the package version from the tag (x.y.z -> x.y.z.0)
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '$v' must look like 1.2.3" }
          $path = "pkg/AppxManifest.xml"
          $xml = Get-Content $path -Raw
          $xml = $xml -replace '(<Identity[^>]*?Version=")[^"]*(")', "`${1}$v.0`$2"
          Set-Content $path $xml -Encoding UTF8
          Select-String -Path $path -Pattern 'Version="' | Select-Object -First 1

      - name: Pack MSIX
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
                 Sort-Object FullName -Descending | Select-Object -First 1
          & $sdk.FullName pack /d pkg /p "TRACE-$env:TAG.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: trace-msix-${{ env.TAG }}
          path: |
            TRACE-${{ env.TAG }}.msix
            store-listing-icon-300.png
          retention-days: 90