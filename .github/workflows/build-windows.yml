name: Build Windows Exe

# Produces TRACE.exe via a GitHub-hosted Windows runner. Runs automatically
# on a version tag (and attaches the zip to the GitHub Release for that
# tag); can also be triggered manually from the Actions tab to test a build
# without cutting a release.
#
# Mirrors build-macos.yml's approach: PyInstaller can't point directly at
# src/gt7telem/launcher.py because of the package's relative imports, so we
# write a plain entry-point script that imports gt7telem as an installed
# package instead.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TRACE.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: python -m pip install . pyinstaller

      - name: Write PyInstaller entry point
        shell: bash
        run: |
          cat > entrypoint.py << 'EOF'
          import sys
          from gt7telem.launcher import main

          if __name__ == "__main__":
              sys.exit(main())
          EOF

      - name: Build TRACE.exe
        shell: bash
        run: |
          PKG_DIR=$(python -c "import gt7telem, os; print(os.path.dirname(gt7telem.__file__))")
          pyinstaller --onefile --windowed --name TRACE \
            --add-data "$PKG_DIR/car_ids.csv;gt7telem" \
            --add-data "$PKG_DIR/course_ids.csv;gt7telem" \
            entrypoint.py

      - name: Zip the exe
        shell: bash
        run: |
          cd dist
          7z a ../gt7telem-windows.zip TRACE.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gt7telem-windows
          path: gt7telem-windows.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gt7telem-windows.zip
