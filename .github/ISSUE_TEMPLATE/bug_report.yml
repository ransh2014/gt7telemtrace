name: Bug report
description: Something in TRACE isn't working right
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected instead, and what actually happened.
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install TRACE?
      options:
        - pip (gt7tracetelem)
        - Windows .exe
        - Linux binary
        - Python source (from GitHub)
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Live Dashboard
        - Lap Analyst
        - Race Analyst
        - Not sure / other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and Python version (if running from source/pip)
      placeholder: e.g. Windows 11, Python 3.12
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output or error message
      description: Anything printed to the console, or shown in the Dashboard's connection diagnostics.
      render: shell
    validations:
      required: false
